<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>顔ランキング</title>
<style>
:root{--bg:#f7f7f8;--card:#fff;--text:#18181b;--muted:#71717a;--line:#e4e4e7}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#fafafa,#f1f1f3);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button{font:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
header{text-align:center;margin:10px 0 24px}
h1{font-size:clamp(28px,5vw,44px);margin:0 0 8px}.sub{color:var(--muted);margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px #0000000a;padding:22px}
.hidden{display:none!important}
.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:10px}
.bar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin-bottom:24px}.bar>i{display:block;height:100%;background:#18181b}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.choice{border:2px solid transparent;background:#fafafa;border-radius:20px;padding:12px;cursor:pointer;transition:none;-webkit-tap-highlight-color:transparent;visibility:visible!important;opacity:1!important}
.choice:hover{border-color:#aaa}.choice canvas{width:100%;aspect-ratio:1;border-radius:14px;display:block}
.name{font-size:20px;font-weight:700;padding:13px 4px 4px}
.game-actions{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px}.start{text-align:center;padding:30px 10px}.start p{color:var(--muted);line-height:1.8}
.primary{border:0;background:#18181b;color:#fff;border-radius:14px;padding:14px 28px;font-weight:700;cursor:pointer}
.secondary{border:1px solid var(--line);background:#fff;color:#222;border-radius:14px;padding:12px 20px;font-weight:700;cursor:pointer}
.secondary:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;align-items:end;gap:8px;margin:14px auto 16px;max-width:660px}
.place{min-width:0}.place .photo{background:#fff;border-radius:18px;padding:8px;border:1px solid var(--line)}
.place img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}.place .rank{font-size:24px;font-weight:900;margin:5px 0 1px}
.place .nm{font-size:16px;font-weight:800;margin-bottom:4px}.place.first .rank{font-size:30px}.place.second,.place.third{padding-top:22px}
.results-list{max-width:900px;margin:0 auto;text-align:left}.results-list h2{text-align:center;font-size:18px;margin:0 0 6px}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.row{display:flex;align-items:center;gap:6px;padding:4px 4px;border-bottom:1px solid var(--line);min-width:0}
.num{width:30px;flex-shrink:0;font-weight:800;color:var(--muted);font-size:12px}.thumb{width:30px;height:30px;object-fit:cover;border-radius:7px;flex-shrink:0}
.rname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;justify-content:center;gap:10px;margin-top:26px;flex-wrap:wrap}.note{font-size:12px;color:var(--muted);margin-top:18px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal-card{width:min(560px,100%);background:#fff;border-radius:18px;padding:18px}.modal textarea{width:100%;height:250px;padding:10px;border:1px solid var(--line);border-radius:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#18181b;color:#fff;padding:11px 16px;border-radius:12px;z-index:60}
@media(max-width:640px){
 .wrap{padding:16px 10px 36px}.panel{padding:14px}.choice-grid{gap:8px}.choice{padding:7px}.name{font-size:17px}
 .podium{gap:4px;margin:8px auto 12px;max-width:560px}.place .rank{font-size:20px}.place.first .rank{font-size:25px}.place .nm{font-size:13px}.place.second,.place.third{padding-top:18px}
 .results-grid{grid-template-columns:repeat(3,1fr);gap:0 3px}.row{gap:3px;padding:3px 1px}.num{width:24px;font-size:10px}.thumb{width:26px;height:26px}.rname{font-size:11px}
}
</style>
</head>
<body>
<div class="wrap">
<header><h1>顔ランキング</h1><p class="sub">好きなほうを選んでください</p></header>

<section id="start" class="panel start">
<h2>あなたの好みランキングを作ろう</h2>
<p>写真を2人ずつ比較します。<br>直感で「好きなほう」を選んでください。</p>
<button class="primary" id="startBtn">ランキングを始める</button>
</section>

<section id="game" class="panel hidden">
<div class="progress"><span id="progressText"></span><span id="countText"></span></div>
<div class="bar"><i id="bar" style="width:0"></i></div>
<div class="choice-grid">
<button class="choice" id="left"><canvas width="800" height="800"></canvas><div class="name"></div></button>
<button class="choice" id="right"><canvas width="800" height="800"></canvas><div class="name"></div></button>
</div>
<div class="game-actions"><button class="secondary" id="undoBtn" disabled>ひとつ前に戻る</button><span class="hint">写真をタップして選択</span></div>
</section>

<section id="result" class="panel result hidden">
<h2>あなたのランキング</h2><p class="sub">選んだ結果から順位を作成しました</p>
<div class="podium" id="podium"></div>
<div class="results-list"><h2>4位以下</h2><div id="list" class="results-grid"></div></div>
<div class="actions">
<button class="primary" id="againBtn">もう一度やる</button>
<button class="secondary" id="copyBtn">結果をコピー</button>
<button class="secondary" id="saveBtn">画像で保存</button>
</div>
<p class="note">※結果はこの端末のブラウザ内だけで処理されます。</p>
</section>
</div>

<div id="copyModal" class="modal hidden"><div class="modal-card">
<h3>ランキング結果</h3><textarea id="copyArea" readonly></textarea>
<div class="modal-actions"><button class="secondary" id="closeModal">閉じる</button><button class="primary" id="manualCopy">コピーする</button></div>
</div></div>

<script>
const PEOPLE=[
{name:"はゆ",file:"はゆ.PNG"},{name:"のん",file:"のん.PNG"},{name:"みあ",file:"みあ.PNG"},{name:"しゅらん",file:"しゅらん.PNG"},
{name:"つき",file:"つき.PNG"},{name:"あまね",file:"あまね.PNG"},{name:"るる",file:"るる.PNG"},{name:"あむ",file:"あむ.PNG"},
{name:"ひめ",file:"ひめ.PNG"},{name:"ねむち",file:"ねむち.PNG"},{name:"なこ",file:"なこ.PNG"},{name:"りり",file:"りり.PNG"},
{name:"はお",file:"はお.PNG"},{name:"める",file:"める.PNG"}];

const $=id=>document.getElementById(id);
const start=$("start"),game=$("game"),result=$("result"),left=$("left"),right=$("right");
let ranked=[], history=[], done=0, totalMax=0;
let runs=[], nextRuns=[], runIndex=0, leftRun=null, rightRun=null, i=0, j=0, merged=[], current=null;

function cloneRuns(arr){return arr.map(r=>[...r])}
function snapshot(){
 return {
  ranked:[...ranked],runs:cloneRuns(runs),nextRuns:cloneRuns(nextRuns),runIndex,
  leftRun:leftRun?[...leftRun]:null,rightRun:rightRun?[...rightRun]:null,
  i,j,merged:[...merged],current:current?{a:current.a,b:current.b}:null,done
 };
}
function restore(x){
 ranked=[...x.ranked];runs=cloneRuns(x.runs);nextRuns=cloneRuns(x.nextRuns);runIndex=x.runIndex;
 leftRun=x.leftRun?[...x.leftRun]:null;rightRun=x.rightRun?[...x.rightRun]:null;
 i=x.i;j=x.j;merged=[...x.merged];current=x.current?{a:x.current.a,b:x.current.b}:null;done=x.done;
 showPair();
}
function drawChoice(btn,p){
 const cv=btn.querySelector("canvas"),ctx=cv.getContext("2d"),im=imgCache.get(p.name);
 if(!im||!im.complete||!im.naturalWidth)throw new Error("画像未準備: "+p.name);
 ctx.clearRect(0,0,cv.width,cv.height);
 const sw=im.naturalWidth,sh=im.naturalHeight,side=Math.min(sw,sh),sx=(sw-side)/2,sy=(sh-side)/2;
 ctx.drawImage(im,sx,sy,side,side,0,0,cv.width,cv.height);
 btn.querySelector(".name").textContent=p.name;
 btn.dataset.person=p.name;
}
function remainingMax(){
 // Merge sort of 14 people has a deterministic safe upper bound of n*ceil(log2(n)).
 return Math.max(0,totalMax-done);
}
function updateUI(){
 $("countText").textContent=`あと最大${remainingMax()}回`;
 $("progressText").textContent=`${done}回選択済み`;
 $("bar").style.width=Math.min(99,Math.round(done/Math.max(1,totalMax)*100))+"%";
 $("undoBtn").disabled=!history.length;
}
function showPair(){
 if(!current)return;
 drawChoice(left,current.a);drawChoice(right,current.b);updateUI();
}
function prepareNextComparison(){
 while(true){
  if(leftRun && rightRun){
   if(i<leftRun.length && j<rightRun.length){
    current={a:leftRun[i],b:rightRun[j]};showPair();return;
   }
   while(i<leftRun.length)merged.push(leftRun[i++]);
   while(j<rightRun.length)merged.push(rightRun[j++]);
   nextRuns.push([...merged]);
   leftRun=rightRun=null;merged=[];i=j=0;
  }
  if(runIndex<runs.length){
   if(runIndex===runs.length-1){nextRuns.push([...runs[runIndex]]);runIndex++;continue}
   leftRun=runs[runIndex++];rightRun=runs[runIndex++];i=j=0;merged=[];continue;
  }
  if(nextRuns.length===1){
   ranked=[...nextRuns[0]];current=null;finish();return;
  }
  runs=cloneRuns(nextRuns);nextRuns=[];runIndex=0;
 }
}
async function startGame(){
 start.classList.add("hidden");result.classList.add("hidden");game.classList.remove("hidden");
 $("progressText").textContent="写真を準備中…";$("countText").textContent="";$("undoBtn").disabled=true;
 try{
  if(imgCache.size!==PEOPLE.length)await preloadAll();
 }catch(e){
  alert("画像を読み込めませんでした: "+e.message);game.classList.add("hidden");start.classList.remove("hidden");return;
 }
 const order=shuffle(PEOPLE);
 ranked=[];history=[];done=0;
 runs=order.map(p=>[p]);nextRuns=[];runIndex=0;leftRun=rightRun=null;i=j=0;merged=[];current=null;
 totalMax=PEOPLE.length*Math.ceil(Math.log2(PEOPLE.length));
 prepareNextComparison();
}
let accepting=true;
function choose(p){
 if(!current||!accepting)return;
 accepting=false;
 const before=snapshot();
 history.push(before);
 // exactly one user choice = exactly one increment
 if(p.name===current.a.name){merged.push(leftRun[i++])}
 else if(p.name===current.b.name){merged.push(rightRun[j++])}
 else {history.pop();accepting=true;return}
 done++;
 current=null;
 prepareNextComparison();
 accepting=true;
}
left.onclick=()=>{if(current)choose(current.a)};
right.onclick=()=>{if(current)choose(current.b)};
$("undoBtn").onclick=()=>{
 if(!history.length)return;
 accepting=false;
 restore(history.pop());
 accepting=true;
};

function finish(){
 game.classList.add("hidden");result.classList.remove("hidden");
 const podium=$("podium"),list=$("list");podium.innerHTML="";list.innerHTML="";
 [[1,"second"],[0,"first"],[2,"third"]].forEach(([idx,cls])=>{
  const p=ranked[idx],el=document.createElement("div");el.className="place "+cls;
  el.innerHTML=`<div class="photo"><img src="${path(p)}" alt="${p.name}"></div><div class="rank">${idx+1}位</div><div class="nm">${p.name}</div>`;podium.appendChild(el);
 });
 ranked.slice(3).forEach((p,k)=>{
  const el=document.createElement("div");el.className="row";
  el.innerHTML=`<span class="num">${k+4}位</span><img class="thumb" src="${path(p)}" alt=""><span class="rname">${p.name}</span>`;list.appendChild(el);
 });
}
function rankingText(){return "【顔ランキング】\n"+ranked.map((p,i)=>`${i+1}位 ${p.name}`).join("\n")}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
async function copyNow(text){
 if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);return true}catch(e){}}
 const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.left="-9999px";document.body.appendChild(ta);ta.select();
 let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();return ok;
}
$("copyBtn").onclick=async()=>{
 const t=rankingText();if(await copyNow(t)){toast("コピーしました")}else{$("copyArea").value=t;$("copyModal").classList.remove("hidden");$("copyArea").select()}
};
$("manualCopy").onclick=async()=>{if(await copyNow($("copyArea").value)){$("copyModal").classList.add("hidden");toast("コピーしました")}else{$("copyArea").select()}};
$("closeModal").onclick=()=>$("copyModal").classList.add("hidden");

async function saveImage(){
 const btn=$("saveBtn");
 btn.disabled=true;
 btn.textContent="画像を作成中…";
 try{
  const W=1080,H=1600,cv=document.createElement("canvas");
  cv.width=W;cv.height=H;
  const c=cv.getContext("2d");
  if(!c) throw new Error("canvas");

  // roundRect() 非対応ブラウザでも動く角丸パス
  function rr(x,y,w,h,r){
   r=Math.min(r,w/2,h/2);
   c.beginPath();
   c.moveTo(x+r,y);
   c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
   c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
   c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
   c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y);
   c.closePath();
  }

  // 保存用にも画像が完全に読み込み済みか確認
  async function getReadyImage(p){
   let im=imgCache.get(p.name);
   if(im && im.complete && im.naturalWidth>0) return im;
   im=new Image();
   im.src=path(p);
   if(im.decode){
    await im.decode();
   }else{
    await new Promise((resolve,reject)=>{
     im.onload=resolve; im.onerror=reject;
    });
   }
   imgCache.set(p.name,im);
   return im;
  }

  // 14枚全部の保存用画像を先に確定
  await Promise.all(ranked.map(getReadyImage));

  c.fillStyle="#f7f7f8";c.fillRect(0,0,W,H);
  c.fillStyle="#18181b";c.textAlign="center";
  c.font='bold 60px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif';
  c.fillText("あなたの顔ランキング",W/2,92);

  async function drawCard(p,x,y,w,rank){
   c.fillStyle="#fff";rr(x,y,w,w+95,22);c.fill();
   const im=await getReadyImage(p);
   c.save();rr(x+9,y+9,w-18,w-18,16);c.clip();
   c.drawImage(im,x+9,y+9,w-18,w-18);c.restore();
   c.fillStyle="#18181b";c.textAlign="center";
   c.font='bold 31px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif';
   c.fillText(rank+"位",x+w/2,y+w+43);
   c.font='bold 27px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif';
   c.fillText(p.name,x+w/2,y+w+78);
  }

  await drawCard(ranked[1],90,220,270,2);
  await drawCard(ranked[0],405,175,270,1);
  await drawCard(ranked[2],720,220,270,3);

  c.fillStyle="#18181b";c.textAlign="left";
  c.font='bold 34px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif';
  c.fillText("4位以下",70,745);

  const rest=ranked.slice(3);
  for(let i=0;i<rest.length;i++){
   const p=rest[i],col=i%2,row=Math.floor(i/2);
   const x=70+col*475,y=780+row*112;
   c.fillStyle="#fff";rr(x,y,465,102,15);c.fill();
   const im=await getReadyImage(p);
   c.save();rr(x+10,y+9,84,84,11);c.clip();
   c.drawImage(im,x+10,y+9,84,84);c.restore();
   c.fillStyle="#71717a";c.textAlign="left";
   c.font='bold 25px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif';
   c.fillText((i+4)+"位",x+110,y+42);
   c.fillStyle="#18181b";
   c.font='bold 29px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif';
   c.fillText(p.name,x+110,y+78);
  }

  const blob=await new Promise((resolve,reject)=>{
   try{cv.toBlob(b=>b?resolve(b):reject(new Error("blob")),"image/png")}
   catch(e){reject(e)}
  });

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="顔ランキング.png";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  toast("画像を保存しました");
 }catch(e){
  console.error("saveImage error:",e);
  alert("画像の保存に失敗しました。ページを再読み込みして、もう一度お試しください。");
 }finally{
  btn.disabled=false;
  btn.textContent="画像で保存";
 }
}
$("saveBtn").onclick=saveImage;$("startBtn").onclick=startGame;$("againBtn").onclick=startGame;
</script>
</body>
</html>
